<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} · Waifu Shop</title>
  <style>
    body { margin: 0; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #100915; color: #fff8fc; display: grid; min-height: 100vh; place-items: center; padding: 24px; }
    .box { width: min(720px, 100%); background: #1d1125; border: 1px solid #3b2848; border-radius: 24px; padding: 28px; box-shadow: 0 24px 70px rgba(0,0,0,.35); }
    h1 { margin: 0 0 12px; font-size: 2.2rem; letter-spacing: -.05em; color: {{ '#9cffcb' if ok else '#ff8fab' }}; }
    p { color: #bdaec9; line-height: 1.55; }
    code { color: #9be7ff; word-break: break-all; }
    a { color: #ffacd1; text-decoration: none; font-weight: 800; }
  </style>
</head>
<body>
  <div class="box">
    <h1>{{ title }}</h1>
    <p><code>{{ message }}</code></p>
    <p><a href="/">Back to Azur Lane catalog</a></p>
  </div>
</body>
</html>
