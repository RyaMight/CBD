<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout · Waifu Shop</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #100915; color: #fff8fc; }
    main { max-width: 980px; margin: 0 auto; padding: 42px 24px; }
    a { color: #ffacd1; text-decoration: none; }
    .layout { display: grid; grid-template-columns: .9fr 1.1fr; gap: 24px; margin-top: 22px; }
    .panel { background: #1d1125; border: 1px solid #3b2848; border-radius: 24px; padding: 24px; box-shadow: 0 24px 70px rgba(0,0,0,.35); }
    .image { height: 320px; border-radius: 20px; background: linear-gradient(135deg, #ff7abb, #7a5cff 58%, #2bd9ff); display: grid; place-items: center; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; overflow: hidden; }
    .image img { width: 100%; height: 100%; object-fit: cover; display: block; }
    h1 { margin: 0 0 12px; font-size: 2.2rem; letter-spacing: -.05em; }
    .muted { color: #bdaec9; line-height: 1.55; }
    .row { display: flex; justify-content: space-between; border-bottom: 1px solid #3b2848; padding: 14px 0; }
    label { display: block; margin: 18px 0 8px; color: #bdaec9; font-size: .92rem; }
    input, select { width: 100%; max-width: 100%; border: 1px solid #3b2848; border-radius: 14px; background: #120719; color: #fff; padding: 12px; }
    button { width: 100%; margin-top: 22px; border: 0; border-radius: 16px; padding: 14px 16px; color: white; font-weight: 900; background: linear-gradient(135deg, #ff6aaa, #8d6bff); cursor: pointer; }
    @media (max-width: 760px) { .layout { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <a href="/">← Back to catalog</a>
    <div class="layout">
      <section class="panel">
        <div class="image">
          <img src="{{ item.image }}" alt="{{ item.name }}">
        </div>
        <h1>{{ item.name }}</h1>
        <p class="muted">{{ item.tagline }}</p>
      </section>
      <section class="panel">
        <h1>Checkout</h1>
        <div class="row"><span>Item</span><strong>{{ item.name }}</strong></div>
        <div class="row"><span>Rarity</span><strong>{{ item.rarity }}</strong></div>
        <div class="row"><span>Total</span><strong>{{ '{:,}'.format(item.price) }} gems</strong></div>
        <form method="post" action="/order">
          <input type="hidden" name="item" value="{{ item_id }}">
          <label>Display name</label>
          <input value="guest" disabled>
          <label>Shipping speed</label>
          <select disabled><option>Standard shipping</option></select>
          <button>Place order</button>
        </form>
      </section>
    </div>
  </main>
</body>
</html>
